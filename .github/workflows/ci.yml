name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 코드 및 DB 연결 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chagokchagok
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: chagokchagok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chagokchagok -d chagokchagok_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: chagokchagok
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_DB: chagokchagok_test
      DB_CONNECT_TIMEOUT: "3"
      DB_STATEMENT_TIMEOUT_MS: "5000"
      RUN_DB_TESTS: "1"

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v7

      - name: Python 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 패키지 설치
        run: python -m pip install -r requirements-dev.txt

      - name: 코드 검사
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: 마이그레이션 및 모델 차이 검사
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: 테스트
        run: python -m pytest

      - name: 서버 이미지 빌드와 실행 검사
        run: |
          docker build --tag chagokchagok-backend:ci .
          chagokchagok_docker_env=(--env POSTGRES_HOST --env POSTGRES_PORT --env POSTGRES_USER --env POSTGRES_PASSWORD --env POSTGRES_DB)
          docker run --rm --network host "${chagokchagok_docker_env[@]}" chagokchagok-backend:ci python -m alembic upgrade head
          docker run --rm --network host "${chagokchagok_docker_env[@]}" chagokchagok-backend:ci python -m app.db.seed
          docker run --rm --network host "${chagokchagok_docker_env[@]}" chagokchagok-backend:ci python -m alembic check
          docker run --detach --name chagokchagok-api-ci --network host "${chagokchagok_docker_env[@]}" chagokchagok-backend:ci
          trap 'docker logs chagokchagok-api-ci; docker rm --force chagokchagok-api-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/db > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/v1/health/db > /dev/null
          curl --fail --silent http://127.0.0.1:8000/api/v1/vehicles/avante_demo > /dev/null
          curl --fail --silent http://127.0.0.1:8000/openapi.json > /dev/null

  deploy:
    name: EC2 운영 배포
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      id-token: write

    steps:
      - name: AWS 배포 역할 연결
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: AWS 배포 역할 확인
        run: aws sts get-caller-identity --query Arn --output text

      - name: EC2에 배포 명령 보내고 결과 확인
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_PAGER: ""
        run: |
          set -euo pipefail
          printf '배포 커밋 %s\n' "$GITHUB_SHA"
          command_id=$(aws ssm send-command \
            --document-name chagokchagokDeploy \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "CommitSha=$GITHUB_SHA" \
            --timeout-seconds 120 \
            --query 'Command.CommandId' --output text)
          printf 'SSM Command ID %s\n' "$command_id"

          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            if result=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>&1); then
              case "$result" in
                Success)
                  printf 'SSM 배포 실행 완료\n'
                  exit 0
                  ;;
                Pending|InProgress|Delayed|Cancelling) ;;
                *)
                  printf 'SSM 배포 실패 %s\n' "$result" >&2
                  exit 1
                  ;;
              esac
            elif [[ "$result" != *InvocationDoesNotExist* ]]; then
              printf '%s\n' "$result" >&2
              exit 1
            fi
            sleep 10
          done

          printf '결과 조회 시간 초과, AWS Run Command에서 %s를 확인하세요.\n' "$command_id" >&2
          exit 1
